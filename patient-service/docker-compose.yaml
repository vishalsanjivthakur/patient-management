services:
  patient-service-db:
    image: postgres:latest
    container_name: patient-service-db
    ports:
      - "5000:5432"
    volumes:
      - ./db_volumes/patient-service-db:/var/lib/postgresql
    environment:
      - POSTGRES_DB=db
      - POSTGRES_USER=admin_user
      - POSTGRES_PASSWORD=password
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge
    internal: true
